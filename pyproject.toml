[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ulpp"
version = "1.3.2"
description = "把 PDF 版面里的一块或一段文字，按份数排进 A4 标签纸；支持整版与接着打（上次没用完的胶纸），中英双语"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ulpp contributors" }]
keywords = ["pdf", "label", "sticker", "a4", "printing", "layout"]
dependencies = [
    "pdfplumber>=0.11,<1.0",
    "pypdf>=4.0",
    "Pillow>=9",
]

[project.optional-dependencies]
gui = ["tkinterdnd2>=0.3"]     # 想要拖拽入文件可选装
dev = ["pyinstaller>=6"]

[project.scripts]
ulpp = "ulpp.cli:main"

[project.urls]
Homepage = "https://github.com/Imensama/ulpp"
Repository = "https://github.com/Imensama/ulpp"
Issues = "https://github.com/Imensama/ulpp/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 语言包 + 校准向导的插图（560/980 两套分辨率）与测试页原料，缺一不可
ulpp = [
    "locales/*.json",
    "assets/*.pg",
    "assets/*/*/*.png",
]


